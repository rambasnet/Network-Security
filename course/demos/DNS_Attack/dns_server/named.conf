// This is the primary configuration file for the BIND DNS server named.
//
// Please read /usr/share/doc/bind9/README.Debian.gz for information on the 
// structure of BIND configuration files in Debian, *BEFORE* you customize 
// this configuration file.
//
// If you are just adding zones, please do that in /etc/bind/named.conf.local

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
include "/etc/bind/named.conf.default-zones";

zone "attacker32.com" {
    type forward;
    forwarders { 
        10.9.0.153; 
    };
};

zone "0.168.192.in-addr.arpa" {
    type forward;
    forwarders {
        10.9.0.153;
    };
};

zone "example.com" {
    type forward;
    forwarders {
        10.9.0.153;
    };
};

// example.net is resolved from the LEGITIMATE authoritative server (10.9.0.54),
// entirely inside the lab -- no Internet recursion required. The resolvers
// outbound query crosses the 10.9.0.0 LAN, where the attacker sniffs it and
// races a forged reply (cache-poisoning target domain).
zone "example.net" {
    type forward;
    forwarders {
        10.9.0.54;
    };
};
