// Primary configuration file for the "legitimate" example.net name server.

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
include "/etc/bind/named.conf.default-zones";

// This server is the genuine authoritative server for example.net.
zone "example.net" {
    type master;
    file "/etc/bind/zone_example.net";
};
