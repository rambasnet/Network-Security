services:
  attacker:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: kali
    container_name: attacker
    hostname: attacker
    tty: true
    cap_add:
      - ALL
    privileged: true
    volumes:
      - ./volumes:/volumes
    network_mode: host
    command:
      - bash
      - -c
      - |
        iptables -I OUTPUT -p tcp --tcp-flags RST RST -j DROP
        sleep infinity

  server:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    image: ubuntu
    container_name: server
    hostname: server
    tty: true
    cap_add:
      - ALL
    privileged: true
    volumes:
      - ./volumes:/volumes
      - ../FlaskWebApp:/app
    sysctls:
      - net.ipv4.tcp_syncookies=0
      - net.ipv4.tcp_max_syn_backlog=1
      - net.ipv4.tcp_synack_retries=2
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.5
    command:
      - bash
      - -c
      - |
        echo 'Some [top secret] data' > ~/secret.txt
        sleep infinity

  user1:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    image: alpine
    container_name: client
    hostname: client
    tty: true
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.6

  firefox:
    image: jlesage/firefox
    container_name: firefox
    hostname: firefox
    restart: always
    ports:
      - "5800:5800"
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.10

networks:
  net-10.9.0.0:
    name: net-10.9.0.0
    ipam:
      config:
        - subnet: 10.9.0.0/24
